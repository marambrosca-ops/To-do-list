<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="To-do List">

    <title>To-do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        html {
            height: -webkit-fill-available;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 18px;
            border-radius: 24px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #2d3748;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px; 
            color: #2d3748;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button.add-btn {
            padding: 0 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
        }

        button.add-btn:active {
            transform: scale(0.96);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 45vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        li {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        li.fade-out {
            opacity: 0;
            transform: scale(0.9) translateX(20px);
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 100%;
        }

        .task-content input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #edf2f7;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .task-content input[type="checkbox"]:checked {
            background: #38a169;
            border-color: #38a169;
        }

        .task-content input[type="checkbox"]:checked::after {
            content: '✔';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-text {
            color: #2d3748;
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>To-do List</h2>
    <div class="input-group">
        <input type="text" id="taskInput" onkeypress="if(event.key === 'Enter') addTask()">
        <button class="add-btn" onclick="addTask()">Aggiungi</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        const input = document.getElementById('taskInput');
        const taskText = input.value.trim();
        if (taskText === '') return;

        const taskList = document.getElementById('taskList');
        const li = document.createElement('li');
        li.innerHTML = `
            <label class="task-content">
                <input type="checkbox" onchange="completeTask(this)">
                <span class="task-text">${escapeHTML(taskText)}</span>
            </label>
        `;
        
        taskList.appendChild(li);
        input.value = '';
        input.blur();
    }

    function completeTask(checkbox) {
        const li = checkbox.closest('li');
        li.classList.add('fade-out');
        setTimeout(() => {
            li.remove();
        }, 300);
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
